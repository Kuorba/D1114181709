<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>貪食蛇</title>

<!-- favicon -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'>
<defs>
<linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
<stop offset='0%' stop-color='%238b5cf6'/>
<stop offset='25%' stop-color='%2306b6d4'/>
<stop offset='50%' stop-color='%2322c55e'/>
<stop offset='75%' stop-color='%23facc15'/>
<stop offset='100%' stop-color='%23ef4444'/>
</linearGradient>
</defs>
<path d='M60 120 C40 80,70 40,110 60 C150 80,140 120,110 130 C80 140,60 160,80 170'
stroke='url(%23g)' stroke-width='18' fill='none' stroke-linecap='round'/>
<circle cx='100' cy='100' r='6' fill='%2338bdf8'/>
</svg>">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<!-- Logo -->
<svg width="200" height="200" viewBox="0 0 200 200">
<defs>
<linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#8b5cf6"/>
<stop offset="50%" stop-color="#06b6d4"/>
<stop offset="100%" stop-color="#22c55e"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="4"/>
</filter>
</defs>

<path d="M60 120 C40 80,70 40,110 60 C150 80,140 120,110 130 C80 140,60 160,80 170"
stroke="url(#flowGradient)" stroke-width="16"
fill="none" stroke-linecap="round" filter="url(#glow)"/>

<circle cx="80" cy="170" r="7" fill="#111827"/>
<circle cx="82" cy="168" r="2.5" fill="#ef4444"/>
<circle cx="100" cy="100" r="5" fill="#38bdf8"/>
</svg>

<!-- 主畫面 -->
<div id="startScreen" class="screen card">
<h1>貪食蛇 🐍</h1>
<button onclick="startGame()">開始遊戲</button>
<button onclick="showLeaderboard()">排行榜</button>
</div>

<!-- 遊戲 -->
<div id="gameScreen" class="screen">
<div id="score">分數: 0</div>
<canvas id="gameCanvas" width="600" height="600"></canvas><br>
<button onclick="goHome()">返回主畫面</button>
</div>

<!-- 結束 -->
<div id="gameOverScreen" class="screen card">
<h1>遊戲結束 💀</h1>
<p id="finalScore"></p>
<button onclick="startGame()">再玩一次</button>
<button onclick="showLeaderboard()">排行榜</button>
<button onclick="goHome()">返回主畫面</button>
</div>

<!-- 排行榜 -->
<div id="leaderboardScreen" class="screen card">
<h1>🏆 排行榜</h1>
<div id="leaderboard"></div>
<button onclick="goHome()">返回主畫面</button>
</div>

</div>

<script src="game.js"></script>
</body>
</html>
